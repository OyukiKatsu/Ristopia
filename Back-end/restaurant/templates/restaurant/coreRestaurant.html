{% load static %}
{% load static tailwind_tags %}
{% load custom_filters %}

<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <link href="{% static 'core/' %}toast.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="{% static 'core/' %}toast.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ristòpia</title>

  <link rel="icon" type="image/png" href="/media/core/Icon.png" />
  {% tailwind_css %}
</head>
<body>


{% block content %}
{% endblock content %}





</body>


<style>
html, body {
  height: 100%; 
  overflow-x: hidden; 
  
}

body {
  overflow-y: scroll; 
}

body::-webkit-scrollbar {
  display: none;
}

body {
  -ms-overflow-style: none;  
  scrollbar-width: none; 
}
</style>

<script>

  toastr.options = {
    "closeButton": true,
    "debug": false,
    "newestOnTop": false,
    "progressBar": true,
    "positionClass": "toast-top-center",
    "preventDuplicates": false,
    "onclick": null,
    "showDuration": "300",
    "hideDuration": "1000",
    "timeOut": "5000",
    "extendedTimeOut": "1000",
    "showEasing": "swing",
    "hideEasing": "linear",
    "showMethod": "fadeIn",
    "hideMethod": "fadeOut"
  }
  {% if messages %}
    {% for message in messages %}
        {% with message.message|split:"|" as parts %}
            {% if message.tags == 'success' %}
                toastr.success('{{parts.1}}', '{{parts.0}}')
            {% elif message.tags == 'error' %}
                toastr.error('{{parts.1}}', '{{parts.0}}')
            {% elif message.tags == 'warning' %}
                toastr.warning('{{parts.1}}', '{{parts.0}}')
            {% elif message.tags == 'info' %}
                toastr.info('{{parts.1}}', '{{parts.0}}')
            {% endif %}
        {% endwith %}
    {% endfor %}
{% endif %}
</script>
</html>
